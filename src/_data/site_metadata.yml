# Events render on the homepage (the first two) and in full on /events.
# Attending counts as much as talking: set kind: speaking for a talk and
# kind: attending for a conference you were part of. Keys per entry: kind,
# event, location, title, description, image, alt, and optional slides/video.
#
# PLACEHOLDER DATA. The three entries below and the images in
# src/images/events/ are stand-ins so the layout can be reviewed. Replace the
# text with real events and the SVGs with real photos before deploying, or set
# this back to `events: []` to hide the section entirely.
events:
  - kind: conference
    event: Rubycon
    location: Rimini, Italy
    title: Rubycon Organizer
    description: >-
      RubyDay went away, so a few of us built our own: a full day of Ruby
      talks in Rimini, speakers picked for what they know rather than who
      pays, and it ends on a Friday so the sea is right there when it does.
    image: /images/events/rubycon.png
    alt: On stage at Rubycon, the Ruby conference in Rimini
  - kind: radio interview
    event: Storytime
    location: Bologna, Italy
    title: How it feels being a software developer today
    description: >-
      An hour on Bologna radio about what this job is actually like, told
      honestly: the good days, the pages at 3am, and why I still choose it.
    image: /images/events/storytime.jpeg
    alt: Recording an interview with Storytime, a radio network in Bologna
  - kind: workshop
    event: Devfest
    location: Modena, Italy
    title: Build your first MCP server in Ruby
    description: >-
      A hands-on session where everyone leaves with a working MCP server in
      Ruby and at least one idea for what to connect it to.
    image: /images/events/devfest_workshop.jpg
    alt: Running the MCP-in-Ruby workshop at DevFest in Modena

