# Welcome to Bridgetown!
#
# This config file is for settings that affect your whole site, values
# which you are expected to set up once and rarely edit after that.
#
# A list of all available configuration options can be found here:
# https://www.bridgetownrb.com/docs/configuration/options
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `bin/bridgetown start`. If you change this file, please restart the server
# process.
#
# For reloadable site metadata like title, SEO description, social media
# handles, etc., take a look at `src/_data/site_metadata.yml`

# the base hostname & protocol for your site, e.g. https://example.com
url: "https://achris.me"
lang: "en_US"

permalink: simple
template_engine: erb

# Posts live under one prefix no matter which `categories` they declare.
# Without this, `permalink: simple` derives the URL from the first category,
# so a post tagged `articles` silently lands on /articles/<slug>/ while every
# other post lands on /posts/<slug>/. See src/articles/ for the legacy redirect.
defaults:
  - scope:
      type: posts
    values:
      permalink: /posts/:slug/

collections:
  projects:
    output: true
    future: true
    permalink: simple
    # Every project declares an explicit `order`, so the grid is deterministic.
    # (Dates are not usable for ordering: several projects share a date.)
    sort_by: order
    sort_direction: ascending
